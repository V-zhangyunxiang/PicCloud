import org.gradle.api.GradleException
import java.util.Locale

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    id 'io.threadtamer.weaver' version '1.0.0'
}

threadTamer {
    active.set(true)
    ignoredTypePrefixes.set([
        "io.threadtamer.runtime.",
        "kotlin.",
        "kotlinx.",
        "java.",
        "javax.",
        "android.",
        "androidx."
    ])
}

android {
    namespace 'trade.ads.boost.app'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.jbstuk.bible.now"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        missingDimensionStrategy 'product', 'ember'
    }

    lint {
        checkReleaseBuilds(false)
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }
}

androidComponents {
    // Demo 只需要调试包，禁用 QA 与 Release 变体，防止误用正式配置。
    beforeVariants(selector().withBuildType("qa")) { it.enable = false }
    beforeVariants(selector().withBuildType("release")) { it.enable = false }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.cardview
    implementation libs.androidx.constraintlayout

    implementation project(":poseidon")
    debugImplementation "io.threadtamer:thread-tamer-runtime:1.0.0-debug"
    releaseImplementation "io.threadtamer:thread-tamer-runtime:1.0.0-release"
    implementation "com.google.firebase:firebase-analytics:22.1.2"
    implementation "com.google.firebase:firebase-config:22.0.1"
    implementation 'com.adjust.sdk:adjust-android:5.3.0'

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}

afterEvaluate {
    configurations.each { configuration ->
        if (configuration.name.toLowerCase(Locale.ROOT).endsWith("implementation")) {
            configuration.dependencies.each { dependency ->
                def version = dependency.version
                if (version &&
                    dependency.name == "poseidon" &&
                    (version.contains("-qa") || version.contains("-release"))
                ) {
                    throw GradleException("Poseidon Demo must not depend on QA/Release SDK builds ($version).")
                }
            }
        }
    }
}
