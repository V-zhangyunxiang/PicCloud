static def sanitizeForBuildConfig(String raw) {
    return raw?.replace("\\", "\\\\")?.replace("\"", "\\\"") ?: ""
}

static def parseCommaSeparatedList(String raw) {
    return raw ? raw.split("[,;]").collect { it.trim() }.findAll { !it.isEmpty() } : []
}

static def capitalizeForGradle(String raw) {
    if (!raw) {
        return raw
    }
    def firstChar = raw.substring(0, 1).toUpperCase(Locale.ROOT)
    return firstChar + raw.substring(1)
}

class ProductFlavorConfig {
    final String flavorName
    final String releaseAdConfig
    final String releaseAdmobAppId
    final String inlineReleaseAdConfig
    final String maticooAppKey

    ProductFlavorConfig(String flavorName, String releaseAdConfig, String releaseAdmobAppId, String inlineReleaseAdConfig, String maticooAppKey) {
        this.flavorName = flavorName
        this.releaseAdConfig = releaseAdConfig
        this.releaseAdmobAppId = releaseAdmobAppId
        this.inlineReleaseAdConfig = inlineReleaseAdConfig
        this.maticooAppKey = maticooAppKey
    }
}

