def androidComponentsExt = project.extensions.findByName("androidComponents")
if (androidComponentsExt != null) {
    androidComponentsExt.onVariants(androidComponentsExt.selector().all()) { variant ->
        def buildType = variant.buildType
        if (!buildType) {
            return
        }
        def normalizedBuildType = buildType.toLowerCase(Locale.ROOT)
        if (!allowedBuildTypes.contains(normalizedBuildType)) {
            return
        }
        def productFlavorEntry = variant.productFlavors.find { it.first == productDimensionName }
        def productFlavor = productFlavorEntry ? productFlavorEntry.second : null
        if (!productFlavor) {
            return
        }
        def variantSuffix = "${productFlavor}-${normalizedBuildType}"
        def bundleTaskName = "bundle${capitalizeForGradle(variant.name)}Aar"
        bundleTasksForAggregation << bundleTaskName
        bundleTaskSuffixes[bundleTaskName] = variantSuffix
    }
}

tasks.withType(BundleAar).configureEach {
    def suffix = bundleTaskSuffixes[name]
    if (suffix) {
        archiveFileName.set("${baseVersionName}-${suffix}.aar")
    }
}
android.libraryVariants.configureEach { LibraryVariant variant ->
    tasks.named("merge${variant.name.capitalize()}JniLibFolders").get().dependsOn 'cargoBuild'
}

cargo {
    def home = System.getProperty("user.home")
    module  = "src/rust/cryptor"       // Or whatever directory contains your Cargo.toml
    libname = "PoseidonCypt"          // Or whatever matches Cargo.toml's [package] name.
    targets = ["arm", "arm64", "x86_64", "x86"]  // See bellow for a longer list of options
    profile = "release"
    rustcCommand = "$home/.cargo/bin/rustc"
    cargoCommand = "$home/.cargo/bin/cargo"
    pythonCommand = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows") ? "python" : "/usr/bin/python3"
    exec { spec, toolchain ->
        def modulePath = project.file(cargo.module)
        // https://doc.rust-lang.org/cargo/reference/config.html#buildrustflags
        spec.environment("CARGO_BUILD_RUSTFLAGS", "--remap-path-prefix=$home=/Lotus --remap-path-prefix=${modulePath}=/Sequoia")
        // Support 16KB page sizes
        // https://developer.android.com/guide/practices/page-sizes#other-build-systems
        spec.environment("RUST_ANDROID_GRADLE_CC_LINK_ARG", "-Wl,-z,max-page-size=16384,-soname,lib${libname}.so")
    }
}

tasks.named("clean", Delete) {
    delete(project.layout.buildDirectory)
    delete(project.file(cargo.module + "/target"))
}

afterEvaluate {
    extensions.configure(PublishingExtension) { publishing ->
        def repositoryName = "xal"
        if (publishing.repositories.findByName(repositoryName) == null) {
            def releaseRepositoryUrl = findProperty('RELEASE_REPOSITORY_URL')?.toString() ?: 'https://maven.apuscn.com/nexus/content/repositories/android-xal-releases/'
            def snapshotRepositoryUrl = findProperty('SNAPSHOT_REPOSITORY_URL')?.toString() ?: 'https://maven.apuscn.com/nexus/content/repositories/android-xal-snapshots/'
            publishing.repositories.maven {
                name = repositoryName
                url = project.version.toString().endsWith("SNAPSHOT") ? snapshotRepositoryUrl : releaseRepositoryUrl
                credentials {
                    username = findProperty('MAVEN_USERNAME')?.toString() ?: ''
                    password = findProperty('MAVEN_PASSWORD')?.toString() ?: ''
                }
            }
        }

        ["release", "maven"].each { name ->
            def publication = publishing.publications.findByName(name)
            if (publication) {
                publishing.publications.remove(publication)
            }
        }

        def publicationNames = []
        def qaPublicationNames = []
        productFlavorsConfig.each { config ->
            allowedBuildTypes.each { buildTypeName ->
                def componentName = "${config.flavorName}${capitalizeForGradle(buildTypeName)}"
                def component = project.components.findByName(componentName)
                if (!component) {
                    return
                }
                def normalizedBuildType = buildTypeName.toLowerCase(Locale.ROOT)
                def publicationName = "poseidon${capitalizeForGradle(config.flavorName)}${capitalizeForGradle(buildTypeName)}"
                if (!publishing.publications.findByName(publicationName)) {
                    publishing.publications.create(publicationName, MavenPublication) {
                        from(component)
                        groupId = groupIdValue
                        artifactId = artifactIdBase
                        version = "${baseVersionName}-${config.flavorName}-${normalizedBuildType}"
                        pom {
                            name.set("${pomDisplayName}-${config.flavorName}-${normalizedBuildType}")
                            description.set(pomDescription)
                        }
                    }
                }
                publicationNames << publicationName
                if (normalizedBuildType == "qa") {
                    qaPublicationNames << publicationName
                }
            }
        }

        def repositorySuffix = "ToXalRepository"
        def publishDependencyTasks = publicationNames.collect { pubName ->
            def capitalized = capitalizeForGradle(pubName)
            "publish${capitalized}Publication${repositorySuffix}"
        }

        tasks.matching { task ->
            task.name.startsWith("publishReleasePublication") || task.name.startsWith("publishMavenPublication")
        }.configureEach {
            enabled = false
        }

        if (!publishDependencyTasks.isEmpty()) {
            tasks.named("publish") {
                dependsOn(publishDependencyTasks)
            }

            tasks.register("publishAllVariants") {
                group = "publishing"
                description = "Publishes poseidon ${productNamesSummary} (${buildTypesSummary}) variants to Xal repository"
                dependsOn(publishDependencyTasks)
            }
        }

        qaPublicationNames.each { qaPublicationName ->
            def metadataTaskName = "generateMetadataFileFor${capitalizeForGradle(qaPublicationName)}Publication"
            tasks.named(metadataTaskName) { task ->
                doLast {
                    def metadataFile = task.outputFile.get().asFile
                    if (metadataFile.exists()) {
                        def originalContent = metadataFile.getText("UTF-8")
                        def updatedContent = originalContent.replace('"com.android.build.api.attributes.BuildTypeAttr": "qa"', '"com.android.build.api.attributes.BuildTypeAttr": "release"')
                        if (updatedContent != originalContent) {
                            metadataFile.setText(updatedContent, "UTF-8")
                        }
                    }
                }
            }
        }
    }

    if (!bundleTasksForAggregation.isEmpty()) {
        tasks.register("assembleAllProducts") {
            group = "build"
            description = "Bundles poseidon SDK for ${productNamesSummary} (${buildTypesSummary})"
            dependsOn(bundleTasksForAggregation.toList().sort())
        }
    }
}
