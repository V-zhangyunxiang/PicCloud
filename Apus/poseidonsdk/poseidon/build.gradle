def allowedBuildTypes = new LinkedHashSet(buildTypesToInclude)
def releaseBuildTypeAttr = objects.named(BuildTypeAttr, "release")

// 内置广告配置复制任务，用于将 product_env 中的 release_ad_config 嵌入到对应变体资源
abstract class ReleaseAdConfigAssetTask extends DefaultTask {
    @Optional
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getSourceFile()

    @Optional
    @Input
    abstract Property<String> getInlineContent()

    @Input
    abstract Property<String> getAssetFileName()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copyEmbeddedReleaseConfig() {
        def output = outputDir.get().asFile
        project.delete(output)
        output.mkdirs()
        def inlineValue = inlineContent.orNull
        if (inlineValue != null) {
            new File(output, assetFileName.get()).text = inlineValue
        } else {
            def source = sourceFile.get().asFile
            if (!source.exists()) {
                throw new GradleException("Missing release ad config file: ${source.absolutePath}")
            }
            project.copy { spec ->
                spec.from(source)
                spec.into(output)
                spec.rename { assetFileName.get() }
            }
        }
    }
}

ProductFlavorConfig loadProductConfig(String flavorName) {
    def configDir = file("${rootProject.projectDir}/product_env")
    def configFile = new File(configDir, "${flavorName}_config.properties")
    if (!configFile.exists()) {
        throw new GradleException("Missing configuration file for flavor '${flavorName}'. Please create ${configFile.name} under product_env.")
    }
    def props = new Properties()
    configFile.withInputStream { props.load(it) }
    def releaseAdConfigRaw = props.getProperty("release_ad_config")
    def releaseAdmobAppId = props.getProperty("release_admob_app_id")
    if (!releaseAdConfigRaw) {
        throw new GradleException("Property 'release_ad_config' must be defined for flavor '${flavorName}'.")
    }
    if (!releaseAdmobAppId) {
        throw new GradleException("Property 'release_admob_app_id' must be defined for flavor '${flavorName}'.")
    }
    def inlineReleaseAdConfig = null
    def releaseAdConfigDir = new File(configDir, "release_ad_config")
    def releaseAdConfigFile = new File(releaseAdConfigDir, releaseAdConfigRaw)
    def releaseAdConfigAssetName = releaseAdConfigRaw
    if (!releaseAdConfigFile.exists()) {
        inlineReleaseAdConfig = releaseAdConfigRaw
        releaseAdConfigAssetName = "${flavorName}_release_ad_config.bin"
    }

    def maticooAppKey = props.getProperty("maticoo_app_key") ?: ""

    return new ProductFlavorConfig(flavorName, releaseAdConfigAssetName, releaseAdmobAppId, inlineReleaseAdConfig, maticooAppKey)
}

