    // aapt2 has a stupid change that prevents single-element package names.
    // Please star https://issuetracker.google.com/issues/73450622 for updates.
    namespace 'com.poseidon.ad'
    compileSdk libs.versions.compileSdk.get().toInteger()
    ndkVersion libs.versions.ndk.get()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()

        resourcePrefix 'flynk_multiplatform_'

        buildConfigField "String", "POSEIDON_LIB_VERSION", "\"${sanitizeForBuildConfig(baseVersionName)}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            minifyEnabled false
            buildConfigField "boolean", "POSEIDON_DEBUG_SWITCH", "true"
            buildConfigField "boolean", "POSEIDON_TOPON_STRATEGY_ENABLED", "false"
            manifestPlaceholders["ADMOB_APP_ID"] = testAdmobAppId
            manifestPlaceholders["MATICOO_APP_KEY"] = ""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            buildConfigField "boolean", "POSEIDON_DEBUG_SWITCH", "false"
            buildConfigField "boolean", "POSEIDON_TOPON_STRATEGY_ENABLED", "true"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        create("qa") {
            initWith(release)
            matchingFallbacks += ["release"]
            debuggable true
            buildConfigField "boolean", "POSEIDON_DEBUG_SWITCH", "true"
            buildConfigField "boolean", "POSEIDON_TOPON_STRATEGY_ENABLED", "true"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    packagingOptions {
        // https://github.com/Kotlin/kotlinx.coroutines?tab=readme-ov-file#avoiding-including-the-debug-infrastructure-in-the-resulting-apk
        resources.excludes += "DebugProbesKt.bin"
    }

    // Specifies one flavor dimension.
    flavorDimensions = [productDimensionName]
    productFlavors {
        productFlavorsConfig.each { config ->
            create(config.flavorName) {
                dimension productDimensionName
                manifestPlaceholders["ADMOB_APP_ID"] = config.releaseAdmobAppId
                manifestPlaceholders["MATICOO_APP_KEY"] = config.maticooAppKey
                buildConfigField "String", "POSEIDON_RELEASE_AD_CONFIG", "\"${sanitizeForBuildConfig(config.releaseAdConfig)}\""
                buildConfigField "String", "POSEIDON_PRODUCT_NAME", "\"${sanitizeForBuildConfig(config.flavorName)}\""
            }
        }
    }

    publishing {
        productFlavorsConfig.each { config ->
            allowedBuildTypes.each { buildTypeName ->
                def variantName = "${config.flavorName}${capitalizeForGradle(buildTypeName)}"
                singleVariant(variantName) {
                    withSourcesJar()
                }
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile "src/androidMain/AndroidManifest.xml"
            java.srcDirs += ["src/androidMain/kotlin"]
            res.srcDirs += ["src/androidMain/res"]
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def productFlavorEntry = variant.productFlavors.find { it.first == productDimensionName }
        if (productFlavorEntry == null) {
            return
        }
        def flavorName = productFlavorEntry.second
        def flavorConfig = productFlavorsConfig.find { it.flavorName == flavorName }
        if (flavorConfig == null) {
            return
        }
        def taskName = "prepare${variant.name.capitalize()}ReleaseAdConfig"
        def taskProvider = tasks.register(taskName, ReleaseAdConfigAssetTask) { task ->
            task.assetFileName.set(flavorConfig.releaseAdConfig)
            if (flavorConfig.inlineReleaseAdConfig != null) {
                task.inlineContent.set(flavorConfig.inlineReleaseAdConfig)
            } else {
                def releaseAdConfigFile = rootProject.layout.projectDirectory.file("product_env/release_ad_config/${flavorConfig.releaseAdConfig}")
                task.sourceFile.set(releaseAdConfigFile)
            }
            task.outputDir.set(layout.buildDirectory.dir("generated/releaseAdConfig/${variant.name}"))
        }
        variant.sources.assets?.addGeneratedSourceDirectory(taskProvider) { task ->
            task.outputDir
        }
    }

    onVariants(selector().withBuildType("qa")) { variant ->
        variant.compileConfiguration?.attributes?.attribute(BuildTypeAttr.ATTRIBUTE, releaseBuildTypeAttr)
        variant.runtimeConfiguration?.attributes?.attribute(BuildTypeAttr.ATTRIBUTE, releaseBuildTypeAttr)
    }
}

